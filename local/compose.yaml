# 로컬 개발 환경: PostgreSQL + pgvector, LocalStack(S3·SQS)
# 실행: docker compose -f local/compose.yaml up -d
# 포트는 다른 프로젝트와 겹치지 않게 gyeol 전용으로 잡는다.
name: gyeol-local

services:
  postgres:
    # RDS에서 쓸 버전(PostgreSQL 17 + pgvector)에 맞춘다
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: gyeol
      POSTGRES_USER: gyeol
      POSTGRES_PASSWORD: gyeol
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyeol -d gyeol"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ap-northeast-2
    ports:
      - "4566:4566"
    volumes:
      # 컨테이너가 준비되면 버킷·큐·S3 → SQS 알림을 만든다
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      # 초기화 스크립트가 버킷·큐·알림을 모두 갖췄을 때만 만드는 파일 (큐 하나만 보던 때는 중간에 멈춰도 healthy였다, I-1)
      # /proc/1보다 새 파일이어야 한다: 컨테이너를 restart하면 /tmp가 남아 있어 지난번 표시로 healthy가 되던 것을 막는다
      test: ["CMD-SHELL", "test /tmp/gyeol-init-ok -nt /proc/1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
