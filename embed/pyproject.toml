[project]
name = "gyeol-embed"
version = "0.1.0"
description = "곡 설명 임베딩 서비스 (L3-3): multilingual-e5-small ONNX, PyTorch 없음"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=2",
    "huggingface-hub>=0.26",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
