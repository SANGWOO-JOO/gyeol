server:
  port: ${PORT:18080}

spring:
  application:
    name: gyeol-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/gyeol}
    username: ${DB_USER:gyeol}
    password: ${DB_PASSWORD:gyeol}
  flyway:
    # 마이그레이션은 api만 실행한다. SQL 파일은 backend/core에 있다.
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
