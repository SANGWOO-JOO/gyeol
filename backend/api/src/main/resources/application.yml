server:
  port: ${PORT:18080}

spring:
  application:
    name: gyeol-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/gyeol}
    username: ${DB_USER:gyeol}
    password: ${DB_PASSWORD:gyeol}
  flyway:
    # 마이그레이션은 api만 실행한다. SQL 파일은 backend/core에 있다.
    enabled: true
    locations: classpath:db/migration
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}

gyeol:
  session-ttl: 30d
  web-origin: ${WEB_ORIGIN:http://localhost:15173}
  fetcher-url: ${FETCHER_URL:http://localhost:18081}
  identify-queue: ${IDENTIFY_QUEUE:gyeol-local-identify}
  enrich-queue: ${ENRICH_QUEUE:gyeol-local-enrich}
  room:
    song-queue: ${ROOM_SONG_QUEUE:gyeol-local-room-song}
    gift-queue: ${GIFT_QUEUE:gyeol-local-gift-image}
    secure-cookie: ${ROOM_SECURE_COOKIE:false}
  mail:
    # log(가짜 메일, 기본) | ses. ses는 MAIL_FROM이 SES에서 인증한 도메인 주소여야 한다 (infra/terraform/base/ses.tf)
    mode: ${MAIL_MODE:log}
    from: ${MAIL_FROM:}
    from-name: 내 음악 결
    configuration-set: ${MAIL_CONFIG_SET:}
  upload:
    bucket: ${UPLOAD_BUCKET:gyeol-local-uploads}
    max-bytes: 20971520 # 20MB
    presign-ttl: 10m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
