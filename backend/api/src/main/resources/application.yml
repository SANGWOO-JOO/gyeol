server:
  port: ${PORT:18080}

spring:
  application:
    name: gyeol-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/gyeol}
    username: ${DB_USER:gyeol}
    password: ${DB_PASSWORD:gyeol}
  flyway:
    # 마이그레이션은 api만 실행한다. SQL 파일은 backend/core에 있다.
    enabled: true
    locations: classpath:db/migration
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      # 없는 큐를 만들지 않는다(기본은 CREATE: 앱이 기본 설정으로 먼저 만들면 init-aws.sh·Terraform 설정과 어긋남, I-1).
      # 큐는 로컬은 local/localstack/init-aws.sh, 운영은 Terraform만 만든다
      sqs:
        queue-not-found-strategy: fail

gyeol:
  session-ttl: 30d
  web-origin: ${WEB_ORIGIN:http://localhost:15173}
  fetcher-url: ${FETCHER_URL:http://localhost:18081}
  identify-queue: ${IDENTIFY_QUEUE:gyeol-local-identify}
  enrich-queue: ${ENRICH_QUEUE:gyeol-local-enrich}
  room:
    song-queue: ${ROOM_SONG_QUEUE:gyeol-local-room-song}
    gift-queue: ${GIFT_QUEUE:gyeol-local-gift-image}
    # 하루 새 그림 한도(선착순). worker와 같은 환경 변수를 읽어 남은 장수를 보여 준다
    gift-daily-image-limit: ${GIFT_DAILY_IMAGE_LIMIT:10}
    # ⑤ 코드 맞추기: 이유는 worker가 쓴다. 비중은 측정 뒤 조정 (docs/todo/room-api-db.md 11절)
    code-match-queue: ${CODE_MATCH_QUEUE:gyeol-local-code-match}
    code-match:
      min-songs: 5
      daily-limit: 30
      weight-genre: 0.4
      weight-distance: 0.3
      weight-artist: 0.2
      weight-song: 0.1
    secure-cookie: ${ROOM_SECURE_COOKIE:false}
  mail:
    # log(가짜 메일, 기본) | ses. ses는 MAIL_FROM이 SES에서 인증한 도메인 주소여야 한다 (infra/terraform/base/ses.tf)
    mode: ${MAIL_MODE:log}
    from: ${MAIL_FROM:}
    from-name: 내 음악 결
    configuration-set: ${MAIL_CONFIG_SET:}
  # I-30 가수 화면: 최신순 발매일을 다시 모으는 간격
  artist:
    scan-refresh: ${ARTIST_SCAN_REFRESH:7d}
  # ⑥ 관리자: TOTP 비밀값 암호화 키(base64 32바이트). 비어 있으면 관리자 로그인 503
  admin:
    totp-key: ${ADMIN_TOTP_KEY:}
    secure-cookie: ${ADMIN_SECURE_COOKIE:false}
    session-ttl: 1h
    max-fails: 5
    lock-for: 15m
    login-per-minute: 10
  upload:
    bucket: ${UPLOAD_BUCKET:gyeol-local-uploads}
    max-bytes: 20971520 # 20MB
    presign-ttl: 10m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
