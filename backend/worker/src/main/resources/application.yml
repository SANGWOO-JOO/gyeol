server:
  port: ${PORT:18082}

spring:
  application:
    name: gyeol-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/gyeol}
    username: ${DB_USER:gyeol}
    password: ${DB_PASSWORD:gyeol}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}

gyeol:
  worker:
    # 이 워커가 처리할 큐 역할. 쉼표로 여러 개 (parse, identify, cover, enrich, recommend, guess, artist, room)
    role: ${WORKER_ROLE:parse,identify,cover,enrich,recommend,guess,artist,room}
    # 청취 기록 세션에서 식별 뒤 보강·추천까지 자동으로 이어 갈지
    auto-recommend: ${AUTO_RECOMMEND:false}
    # 방송·일반 채널 영상에서 LLM으로 가수·곡 뽑기
    guess:
      queue: ${GUESS_QUEUE:gyeol-local-guess}
    # 음악 방 담기 식별
    room:
      song-queue: ${ROOM_SONG_QUEUE:gyeol-local-room-song}
      song-dlq: ${ROOM_SONG_DLQ:gyeol-local-room-song-dlq}
    # ④ 50곡 선물 캐릭터 (llm.mode=bedrock일 때만 실제 이미지 생성, 비용 발생)
    gift:
      queue: ${GIFT_QUEUE:gyeol-local-gift-image}
      dlq: ${GIFT_DLQ:gyeol-local-gift-image-dlq}
      image-model: ${GIFT_IMAGE_MODEL:stability.stable-image-core-v1:1}
      image-region: ${GIFT_IMAGE_REGION:us-west-2}
      daily-image-limit: ${GIFT_DAILY_IMAGE_LIMIT:50}
    # 음악 지도 데이터 만들기 내부 엔드포인트 (로컬에서만 true)
    map:
      admin-endpoint: ${MAP_ADMIN_ENDPOINT:false}
    # 가수 이미지 (Wikimedia Commons → YouTube 채널 프로필)
    artist-image:
      queue: ${ARTIST_IMAGE_QUEUE:gyeol-local-artist-image}
    parse-queue: ${PARSE_QUEUE:gyeol-local-parse}
    parse-dlq: ${PARSE_DLQ:gyeol-local-parse-dlq}
    upload-bucket: ${UPLOAD_BUCKET:gyeol-local-uploads}
    # 청취 기록 원본 보관 기간
    listen-ttl: 7d
    # L2-1 곡 식별 (docs/l2-design.md)
    identify:
      queue: ${IDENTIFY_QUEUE:gyeol-local-identify}
      dlq: ${IDENTIFY_DLQ:gyeol-local-identify-dlq}
      top-n: ${IDENTIFY_TOP_N:300}
      fetcher-url: ${FETCHER_URL:http://localhost:18081}
    # L2-3a LLM 제목 정리 (fake | bedrock)
    llm:
      mode: ${LLM_MODE:fake}
      model: ${LLM_MODEL:global.anthropic.claude-haiku-4-5-20251001-v1:0}
      debug-endpoint: ${LLM_DEBUG_ENDPOINT:false}
    # L3-4 추천
    recommend:
      queue: ${RECOMMEND_QUEUE:gyeol-local-recommend}
      dlq: ${RECOMMEND_DLQ:gyeol-local-recommend-dlq}
      model: ${RECOMMEND_MODEL:}
    # L3-3 곡 설명 임베딩 서비스
    embed:
      url: ${EMBED_URL:http://localhost:18084}
    # L3-1 지식 인입
    enrich:
      queue: ${ENRICH_QUEUE:gyeol-local-enrich}
      dlq: ${ENRICH_DLQ:gyeol-local-enrich-dlq}
      top-n: ${ENRICH_TOP_N:50}
    # L2-2 앨범 표지
    cover:
      queue: ${COVER_QUEUE:gyeol-local-cover}
      bucket: ${COVER_BUCKET:gyeol-local-covers}
    # 보관 기간이 지난 데이터 정리 (매일 04:00 한국 시간)
    cleanup:
      enabled: ${CLEANUP_ENABLED:true}
      cron: ${CLEANUP_CRON:0 0 4 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
