server {
    listen 80;
    root /usr/share/nginx/html;
    # 11-16 배포 0단계: 압축이 꺼져 있어 CSS 512KB·JS 613KB를 그대로 보냈다. 단일 서버는 Traefik이 압축하지 않으므로 여기서 한다
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    # 화면 주소(/pick, /r/토큰 등)는 모두 index.html로 (클라이언트 라우팅)
    location / {
        try_files $uri /index.html;
    }
    # 화면 진입점은 늘 새로 확인한다 (배포 뒤 옛 index.html이 지워진 assets 파일을 가리키지 않게)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
