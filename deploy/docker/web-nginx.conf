server {
    listen 80;
    root /usr/share/nginx/html;
    # 화면 주소(/pick, /r/토큰 등)는 모두 index.html로 (클라이언트 라우팅)
    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
