{{- if .Values.postgres.enabled }}
# 단일 서버용 PostgreSQL. 데이터는 볼륨(k3s: 서버 디스크)에 두고, 백업은 postgres-backup CronJob이 S3로 올린다
apiVersion: v1
kind: Service
metadata:
  name: gyeol-postgres
  labels: {{- include "gyeol.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: gyeol-postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gyeol-postgres
  labels: {{- include "gyeol.labels" . | nindent 4 }}
    app.kubernetes.io/name: gyeol-postgres
spec:
  serviceName: gyeol-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: gyeol-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gyeol-postgres, app.kubernetes.io/part-of: gyeol }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.db.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: DB_PASSWORD } }
            # 볼륨 최상위에 lost+found가 있으면 initdb가 거절하므로 하위 폴더를 쓴다
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 10
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
{{- if .Values.postgres.backup.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gyeol-postgres-backup
  labels: {{- include "gyeol.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          volumes:
            - { name: dump, emptyDir: {} }
          # 1) pg_dump로 압축 덤프를 만들고 2) aws-cli로 S3에 올린다 (이미지 하나에 둘 다 있는 공식 이미지가 없어 나눔)
          initContainers:
            - name: dump
              image: {{ .Values.postgres.image | quote }}
              command: ["sh", "-c", "pg_dump -h gyeol-postgres -U \"$PGUSER\" -d \"$PGDATABASE\" -Fc -f /dump/gyeol.dump && ls -l /dump"]
              env:
                - { name: PGUSER, value: {{ .Values.db.user | quote }} }
                - { name: PGDATABASE, value: {{ .Values.postgres.database | quote }} }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: DB_PASSWORD } }
              volumeMounts: [{ name: dump, mountPath: /dump }]
          containers:
            - name: upload
              image: {{ .Values.postgres.backup.awsCliImage | quote }}
              command: ["sh", "-c", "aws s3 cp /dump/gyeol.dump \"s3://$BUCKET/${PREFIX}gyeol-$(date -u +%Y%m%dT%H%M%SZ).dump\" $ENDPOINT_ARG"]
              env:
                - { name: BUCKET, value: {{ .Values.postgres.backup.bucket | quote }} }
                - { name: PREFIX, value: {{ .Values.postgres.backup.prefix | quote }} }
                - { name: AWS_REGION, value: {{ .Values.aws.region | quote }} }
                - { name: ENDPOINT_ARG, value: {{ if .Values.aws.endpoint }}{{ printf "--endpoint-url %s" .Values.aws.endpoint | quote }}{{ else }}""{{ end }} }
                {{- if .Values.aws.localstack }}
                - { name: AWS_ACCESS_KEY_ID, value: test }
                - { name: AWS_SECRET_ACCESS_KEY, value: test }
                {{- end }}
              volumeMounts: [{ name: dump, mountPath: /dump }]
{{- end }}
{{- end }}
