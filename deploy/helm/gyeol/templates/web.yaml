apiVersion: apps/v1
kind: Deployment
metadata:
  name: gyeol-web
  labels: {{- include "gyeol.labels" . | nindent 4 }}
    app.kubernetes.io/name: gyeol-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: gyeol-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gyeol-web, app.kubernetes.io/part-of: gyeol }
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/web:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 80 }]
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: gyeol-web
  labels: {{- include "gyeol.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: gyeol-web }
  ports: [{ name: http, port: 80, targetPort: http }]
