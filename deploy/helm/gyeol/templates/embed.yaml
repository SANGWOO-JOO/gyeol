# L3-3 embed 서비스: 곡 설명 → 384차원 벡터. worker만 부른다 (클러스터 안 전용)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gyeol-embed
  labels: {{- include "gyeol.labels" . | nindent 4 }}
    app.kubernetes.io/name: gyeol-embed
spec:
  replicas: {{ .Values.embed.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: gyeol-embed }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gyeol-embed, app.kubernetes.io/part-of: gyeol }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: embed
          image: "{{ .Values.image.registry }}/embed:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.embed.port }} }]
          env:
            - name: EMBED_THREADS
              value: {{ .Values.embed.threads | quote }}
          resources: {{- toYaml .Values.embed.resources | nindent 12 }}
          # 모델 로드에 몇 초 걸린다: 준비되기 전에는 트래픽을 받지 않는다
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gyeol-embed
  labels: {{- include "gyeol.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: gyeol-embed }
  ports: [{ name: http, port: {{ .Values.embed.port }}, targetPort: http }]
{{- if .Values.embed.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gyeol-embed
  labels: {{- include "gyeol.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gyeol-embed }
  minReplicas: {{ .Values.embed.hpa.min }}
  maxReplicas: {{ .Values.embed.hpa.max }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.embed.hpa.cpu }} } }
{{- end }}
