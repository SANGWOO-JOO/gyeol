{{- if .Values.ingress.enabled }}
{{- $root := . }}
{{- $tls := .Values.ingress.tls.enabled }}
{{- /* Traefik 미들웨어 이름: <네임스페이스>-<이름>@kubernetescrd */}}
{{- $mw := list }}
{{- if .Values.rateLimit.enabled }}{{- $mw = append $mw (printf "%s-gyeol-api-ratelimit@kubernetescrd" .Release.Namespace) }}{{- end }}
# 입구: /api → api, 나머지 → web (운영의 같은 출처 구성). 운영(단일 서버)은 Traefik이 Let's Encrypt로 TLS
{{- range $part := list "api" "web" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gyeol-{{ $part }}
  labels: {{- include "gyeol.labels" $root | nindent 4 }}
  annotations:
    {{- if $tls }}
    traefik.ingress.kubernetes.io/router.tls.certresolver: {{ $root.Values.ingress.tls.certResolver }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- end }}
    {{- if and (eq $part "api") $mw }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $mw }}
    {{- end }}
spec:
  {{- with $root.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $tls }}
  tls:
    - hosts: [{{ $root.Values.ingress.host | quote }}]
  {{- end }}
  rules:
    - {{- with $root.Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          {{- if eq $part "api" }}
          - path: /api
            pathType: Prefix
            backend: { service: { name: gyeol-api, port: { number: {{ $root.Values.api.port }} } } }
          {{- else }}
          - path: /
            pathType: Prefix
            backend: { service: { name: gyeol-web, port: { number: 80 } } }
          {{- end }}
{{- end }}
{{- if .Values.admin.restrict }}
---
# 관리자 경로는 허용 IP만 (single-server-terraform.md 8절). 경로가 더 길어 위 /api·/ 보다 먼저 걸린다
# 허용 IP가 비면 127.0.0.1만 = 밖에서는 닫힘
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gyeol-admin-allow
  labels: {{- include "gyeol.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange: {{ (default (list "127.0.0.1/32") .Values.admin.allowedIps) | toJson }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gyeol-admin
  labels: {{- include "gyeol.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-gyeol-admin-allow@kubernetescrd
    {{- if $tls }}
    traefik.ingress.kubernetes.io/router.tls.certresolver: {{ .Values.ingress.tls.certResolver }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /api/admin
            pathType: Prefix
            backend: { service: { name: gyeol-api, port: { number: {{ .Values.api.port }} } } }
          - path: /admin
            pathType: Prefix
            backend: { service: { name: gyeol-web, port: { number: 80 } } }
{{- end }}
{{- if .Values.rateLimit.enabled }}
---
# IP 하나가 /api 전체를 짧은 시간에 많이 부르는 것 (15-1절). 넘으면 429
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gyeol-api-ratelimit
  labels: {{- include "gyeol.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ .Values.rateLimit.average }}
    period: 1s
    burst: {{ .Values.rateLimit.burst }}
{{- end }}
{{- end }}
