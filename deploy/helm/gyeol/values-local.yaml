# k3d 로컬: DB·LocalStack은 맥북의 compose(local/compose.yaml)에 있고, 파드는 host.k3d.internal로 부른다
db:
  url: jdbc:postgresql://host.k3d.internal:15432/gyeol
aws:
  uploadBucket: gyeol-local-uploads
  parseQueue: gyeol-local-parse
  parseDlq: gyeol-local-parse-dlq
  identifyQueue: gyeol-local-identify
  identifyDlq: gyeol-local-identify-dlq
  coverQueue: gyeol-local-cover
  enrichQueue: gyeol-local-enrich
  enrichDlq: gyeol-local-enrich-dlq
  recommendQueue: gyeol-local-recommend
  recommendDlq: gyeol-local-recommend-dlq
  guessQueue: gyeol-local-guess
  artistImageQueue: gyeol-local-artist-image
  # 음악 방 큐 (Terraform base sqs.tf · local/localstack/init-aws.sh와 같은 이름)
  roomSongQueue: gyeol-local-room-song
  roomSongDlq: gyeol-local-room-song-dlq
  giftQueue: gyeol-local-gift-image
  giftDlq: gyeol-local-gift-image-dlq
  codeMatchQueue: gyeol-local-code-match
  codeMatchDlq: gyeol-local-code-match-dlq
  coverBucket: gyeol-local-covers
  endpoint: http://host.k3d.internal:4566
  publicEndpoint: http://localhost:4566
  localstack: true
