# 기본값. 환경별 값은 values-local.yaml(k3d), 나중에 values-eks.yaml(EKS)로 덮어쓴다.
image:
  registry: gyeol          # k3d: 로컬 이미지 이름, EKS: ECR 주소
  tag: dev
  pullPolicy: IfNotPresent

# 클러스터 밖 의존성 (운영에서는 RDS, S3·SQS)
db:
  url: jdbc:postgresql://db.example:5432/gyeol
  user: gyeol
aws:
  region: ap-northeast-2
  uploadBucket: gyeol-uploads
  parseQueue: gyeol-parse
  parseDlq: gyeol-parse-dlq
  identifyQueue: gyeol-identify
  identifyDlq: gyeol-identify-dlq
  coverQueue: gyeol-cover
  enrichQueue: gyeol-enrich
  enrichDlq: gyeol-enrich-dlq
  recommendQueue: gyeol-recommend
  recommendDlq: gyeol-recommend-dlq
  # 비우면 AWS 기본 주소. LocalStack일 때만 채운다
  endpoint: ""
  # 브라우저가 올릴 S3 주소가 서버와 다를 때만 (k3d)
  publicEndpoint: ""

# 비밀 값은 차트 밖에서 만든다: kubectl create secret generic gyeol-secrets (DB_PASSWORD, LASTFM_API_KEY, YOUTUBE_API_KEY)
secretName: gyeol-secrets
contact: https://github.com/SANGWOO-JOO

# 공통 Java 서비스 자원. 힙은 JAVA_TOOL_OPTIONS의 MaxRAMPercentage=70으로 limits에 맞춰진다
javaResources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }

api:
  replicas: 1
  port: 18080
worker:
  replicas: 1
  port: 18082
  # 처리할 큐 역할. EKS 측정 때는 parse·identify를 Deployment로 나눠 따로 늘릴 수 있다
  role: parse,identify,cover,enrich,recommend
  cleanupEnabled: true
  identifyTopN: 300
  # fake | bedrock. bedrock은 파드에 Bedrock 권한(EKS: Pod Identity)이 있어야 한다. k3d에는 AWS 자격 증명이 없어 fake
  llmMode: fake
fetcher:
  replicas: 1
  port: 18081
# L3-3 곡 설명 임베딩 (Python, e5-small ONNX). EKS 회차에서 HPA로 늘어나는 모습을 본다
embed:
  replicas: 1
  port: 18084
  threads: 2
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1Gi }   # 측정: 시작 최대 약 805MB, 사용 중 약 625MB (맥북 M1)
  hpa:
    enabled: true
    min: 1
    max: 4
    cpu: 70

web:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

ingress:
  enabled: true
  className: ""   # k3d: 기본 Traefik
  host: ""        # 비우면 모든 호스트
